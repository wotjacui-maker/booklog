<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>seojae</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="booklog">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .hub {
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }

    .entry {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .entry:hover .pixel-grid { transform: translateY(-2px); }

    .leaf-link {
      display: inline-block;
      text-decoration: none;
      opacity: 0.55;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .leaf-link:hover { opacity: 1; transform: translateY(-2px); }

    .pixel-grid {
      display: grid;
      gap: 0;
      image-rendering: pixelated;
      transition: transform 0.15s ease;
    }

    .px { width: 5px; height: 5px; }
    .K  { background: #111; }
    ._  { background: transparent; }

  </style>
</head>
<body>

<div class="hub">
  <div class="entry" onclick="location.href='books.html'">
    <div class="pixel-grid" id="grid"></div>
  </div>
  <a href="seoul-map/index.html" class="leaf-link" title="서울 책방 지도">
    <div class="pixel-grid" id="leaf-grid"></div>
  </a>
</div>

<script>
function makeGrid(pixels, id, zoom) {
  const cols = pixels[0].length;
  const rows = pixels.length;
  const el = document.getElementById(id);
  el.style.gridTemplateColumns = `repeat(${cols}, 5px)`;
  el.style.gridTemplateRows    = `repeat(${rows}, 5px)`;
  el.style.zoom = zoom;
  pixels.forEach(row => row.forEach(c => {
    const div = document.createElement('div');
    div.className = `px ${c}`;
    el.appendChild(div);
  }));
}
