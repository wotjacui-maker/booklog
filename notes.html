<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>seojae — 메모</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #111;
      font-family: 'Noto Sans KR', monospace;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      padding: 18px 24px 14px;
    }

    .turtle-home {
      display: inline-block;
      text-decoration: none;
      opacity: 0.5;
      transition: opacity 0.15s, transform 0.15s;
    }
    .turtle-home:hover { opacity: 1; transform: translateY(-1px); }

    .notes-list {
      padding: 24px 24px 80px;
      display: flex;
      flex-direction: row;
      gap: 32px;
      overflow-x: auto;
      align-items: flex-start;
    }
    /* 스크롤바 숨김 */
    .notes-list::-webkit-scrollbar { display: none; }

    .book-entry {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex-shrink: 0;
      width: 140px;
    }

    .book-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 100%;
    }

    .book-title {
      font-size: 8pt;
      font-weight: 400;
      color: #111;
      line-height: 1.5;
      word-break: keep-all;
    }

    .book-author {
      font-size: 6.5pt;
      color: #111;
    }

    .book-date {
      font-size: 6pt;
      color: #111;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .book-memo-wrap { margin-top: 8px; width: 100%; }

    .book-memo {
      font-size: 6.5pt;
      color: #111;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: keep-all;
      cursor: text;
      text-align: center;
    }

    .book-no-memo {
      font-size: 6pt;
      color: #111;
      cursor: text;
      letter-spacing: 1px;
    }

    .book-memo-edit {
      font-family: 'Noto Sans KR', monospace;
      font-size: 6.5pt;
      color: #111;
      line-height: 1.8;
      width: 100%;
      border: none;
      border-bottom: 1px solid #111;
      outline: none;
      background: transparent;
      resize: none;
      padding: 0;
      text-align: center;
    }

    /* 이미지 — 텍스트 바로 아래 */
    .book-img-wrap {
      margin-top: 12px;
      cursor: pointer;
      width: 110px;
    }
    .book-img-wrap img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      display: block;
      border-radius: 50%;
    }
    .book-img-placeholder {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #ccc;
    }
    .book-img-wrap:hover img,
    .book-img-wrap:hover .book-img-placeholder { opacity: 0.6; }

    .empty-state {
      padding: 80px 24px;
      text-align: center;
      font-size: 8pt;
      color: #999;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <header>
    <a href="books.html" class="turtle-home" title="books로" id="homeIcon"></a>
  </header>

  <div id="notesList" class="notes-list"></div>
  <div class="empty-state" id="emptyState" style="display:none">완독한 책이 없어요.</div>

  <input type="file" accept="image/*" id="imageInput" style="display:none">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAEqBSiNTrNLFbwYU8ASN8m88S1Ho-RlwU",
      authDomain: "booklog-2b5d0.firebaseapp.com",
      projectId: "booklog-2b5d0",
      storageBucket: "booklog-2b5d0.firebasestorage.app",
      messagingSenderId: "188307139074",
      appId: "1:188307139074:web:9c52728d1232db35f9551b",
      databaseURL: "https://booklog-2b5d0-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(FIREBASE_CONFIG);
    const booksRef = firebase.database().ref('bookshelf_v1');

    let allBooks = [];
    let pendingImageBookId = null;
    let _skipNextRender = false;

    function saveBooks() {
      localStorage.setItem('bookshelf_v1', JSON.stringify(allBooks));
      _skipNextRender = true;
      booksRef.set(JSON.stringify(allBooks));
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return `(${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')})`;
    }

    // 이미지 압축
    function compressImage(file, cb) {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const MAX_W = 200, MAX_H = 280;
          let w = img.width, h = img.height;
          const ratio = w / h;
          if (ratio > MAX_W / MAX_H) { w = MAX_W; h = Math.round(MAX_W / ratio); }
          else { h = MAX_H; w = Math.round(MAX_H * ratio); }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          const isPng = file.type === 'image/png';
          if (!isPng) {
            // JPEG는 투명 없음 — 흰 배경 깔기
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, w, h);
          }
          ctx.drawImage(img, 0, 0, w, h);
          cb(canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', 0.82));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    const imageInput = document.getElementById('imageInput');
    imageInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file || !pendingImageBookId) return;
      compressImage(file, dataUrl => {
        const book = allBooks.find(b => b.id === pendingImageBookId);
        if (!book) return;
        book.image = dataUrl;
        saveBooks();
        const wrap = document.querySelector(`[data-id="${pendingImageBookId}"] .book-img-wrap`);
        if (wrap) wrap.innerHTML = `<img src="${dataUrl}" alt="">`;
        pendingImageBookId = null;
      });
      imageInput.value = '';
    });

    // 메모 편집
    function startMemoEdit(book, memoWrap) {
      const current = book.note || '';
      memoWrap.innerHTML = '';
      const ta = document.createElement('textarea');
      ta.className = 'book-memo-edit';
      ta.value = current;
      ta.rows = Math.max(3, current.split('\n').length + 1);
      memoWrap.appendChild(ta);
      ta.focus();

      let done = false;
      function commit() {
        if (done) return;
        done = true;
        const val = ta.value.trim();
        book.note = val;
        saveBooks();
        renderMemo(book, memoWrap);
      }
      ta.addEventListener('blur', commit);
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ta.blur(); }
        if (e.key === 'Escape') { done = true; book.note = current; renderMemo(book, memoWrap); }
      });
    }

    function renderMemo(book, memoWrap) {
      memoWrap.innerHTML = '';
      if (book.note && book.note.trim()) {
        const el = document.createElement('div');
        el.className = 'book-memo';
        el.textContent = book.note.trim();
        el.addEventListener('click', () => startMemoEdit(book, memoWrap));
        memoWrap.appendChild(el);
      } else {
        const el = document.createElement('div');
        el.className = 'book-no-memo';
        el.textContent = '메모';
        el.addEventListener('click', () => startMemoEdit(book, memoWrap));
        memoWrap.appendChild(el);
      }
    }

    function renderNotes(books) {
      const doneBooks = books.filter(b => b.status === 'done');
      const list = document.getElementById('notesList');
      list.innerHTML = '';

      if (!doneBooks.length) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      document.getElementById('emptyState').style.display = 'none';

      doneBooks.forEach(book => {
        const entry = document.createElement('div');
        entry.className = 'book-entry';
        entry.dataset.id = book.id;

        // 콘텐츠 (텍스트 먼저)
        const content = document.createElement('div');
        content.className = 'book-content';

        const titleEl = document.createElement('div');
        titleEl.className = 'book-title';
        titleEl.textContent = book.title || '—';
        content.appendChild(titleEl);

        if (book.author) {
          const authorEl = document.createElement('div');
          authorEl.className = 'book-author';
          authorEl.textContent = book.author;
          content.appendChild(authorEl);
        }

        if (book.completedAt) {
          const dateEl = document.createElement('div');
          dateEl.className = 'book-date';
          dateEl.textContent = fmtDate(book.completedAt);
          content.appendChild(dateEl);
        }

        const memoWrap = document.createElement('div');
        memoWrap.className = 'book-memo-wrap';
        renderMemo(book, memoWrap);
        content.appendChild(memoWrap);

        entry.appendChild(content);

        // 이미지 — 메모 바로 아래
        const imgWrap = document.createElement('div');
        imgWrap.className = 'book-img-wrap';
        if (book.image) {
          const img = document.createElement('img');
          img.src = book.image;
          img.alt = '';
          imgWrap.appendChild(img);
        } else {
          const ph = document.createElement('div');
          ph.className = 'book-img-placeholder';
          ph.textContent = '+';
          imgWrap.appendChild(ph);
        }
        imgWrap.addEventListener('click', () => {
          pendingImageBookId = book.id;
          imageInput.click();
        });
        entry.appendChild(imgWrap);

        list.appendChild(entry);
      });
    }

    // 집 픽셀 아이콘
    const HOUSE_PIXELS = [
      ['_','_','_','_','_','_','_','_','_','_','_','_','_','_','_','_'],
      ['_','_','_','_','_','_','_','K','K','_','_','_','_','_','_','_'],
      ['_','_','_','_','_','_','K','_','_','K','_','_','_','_','_','_'],
      ['_','_','_','_','_','K','_','_','_','_','K','_','_','_','_','_'],
      ['_','_','_','_','K','_','_','_','_','_','_','K','_','_','_','_'],
      ['_','_','_','K','_','_','_','K','K','_','_','_','K','_','_','_'],
      ['_','_','_','_','K','_','_','_','_','_','_','K','_','_','_','_'],
      ['_','_','_','_','K','_','_','K','K','_','_','K','_','_','_','_'],
      ['_','_','_','_','K','_','K','_','_','K','_','K','_','_','_','_'],
      ['_','_','_','_','K','_','K','_','_','K','_','K','_','_','_','_'],
      ['_','_','_','_','K','K','K','K','K','K','K','K','_','_','_','_'],
      ['_','_','_','_','_','_','_','_','_','_','_','_','_','_','_','_'],
      ['_','_','_','_','_','_','_','_','_','_','_','_','_','_','_','_'],
      ['_','_','_','_','_','_','_','_','_','_','_','_','_','_','_','_'],
    ];
    (function() {
      const el = document.getElementById('homeIcon');
      const grid = document.createElement('div');
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = 'repeat(16, 5px)';
      grid.style.gridTemplateRows = 'repeat(14, 5px)';
      grid.style.zoom = '0.3';
      grid.style.imageRendering = 'pixelated';
      HOUSE_PIXELS.forEach(row => row.forEach(c => {
        const px = document.createElement('div');
        px.style.width = '5px';
        px.style.height = '5px';
        if (c === 'K') px.style.background = '#111';
        grid.appendChild(px);
      }));
      el.appendChild(grid);
    })();

    booksRef.on('value', snapshot => {
      if (_skipNextRender) { _skipNextRender = false; return; }
      const raw = snapshot.val();
      if (raw) {
        try { allBooks = JSON.parse(raw); } catch { allBooks = []; }
      } else {
        allBooks = [];
      }
      renderNotes(allBooks);
    });
  </script>
</body>
</html>
