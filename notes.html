<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>seojae — 메모</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #111;
      font-family: 'Noto Sans KR', monospace;
      min-height: 100vh;
      cursor: none;
    }

    #cursor {
      position: fixed;
      pointer-events: none;
      color: #111;
      font-size: 14px;
      transform: translate(-50%, -50%);
      z-index: 9999;
    }

    .cursor-trail {
      position: fixed;
      pointer-events: none;
      color: #111;
      font-size: 11px;
      transform: translate(-50%, -50%);
      z-index: 9998;
      animation: trail-fade 0.6s ease forwards;
    }

    @keyframes trail-fade {
      0%   { opacity: 0.5; }
      100% { opacity: 0; }
    }

    header {
      display: flex;
      align-items: center;
      padding: 18px 24px 14px;
    }

    .turtle-home {
      display: inline-block;
      text-decoration: none;
      opacity: 0.5;
      transition: opacity 0.15s, transform 0.15s;
    }
    .turtle-home:hover { opacity: 1; transform: translateY(-1px); }

    .notes-list {
      padding: 24px 24px 80px;
      display: flex;
      flex-direction: row;
      gap: 32px;
      overflow-x: auto;
      align-items: flex-start;
    }
    /* 스크롤바 숨김 */
    .notes-list::-webkit-scrollbar { display: none; }

    .book-entry {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex-shrink: 0;
      width: 140px;
    }

    .book-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 100%;
    }

    .book-title {
      font-size: 8pt;
      font-weight: 400;
      color: #111;
      line-height: 1.5;
      word-break: keep-all;
    }

    .book-author {
      font-size: 6.5pt;
      color: #111;
    }

    .book-date {
      font-size: 6pt;
      color: #111;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .book-memo-wrap { margin-top: 8px; width: 100%; }

    .book-memo {
      font-size: 6.5pt;
      color: #111;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: keep-all;
      cursor: none;
      text-align: center;
    }

    .book-no-memo {
      font-size: 6pt;
      color: #111;
      cursor: none;
      letter-spacing: 1px;
    }

    .book-memo-edit {
      font-family: 'Noto Sans KR', monospace;
      font-size: 6.5pt;
      color: #111;
      line-height: 1.8;
      width: 100%;
      border: none;
      border-bottom: 1px solid #111;
      outline: none;
      background: transparent;
      resize: none;
      padding: 0;
      text-align: center;
    }

    /* 작은 독서 스티커 */
    .book-art { height: 108px; display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .book-img-wrap {
      width: 72px; height: 72px; border: 0; padding: 0;
      background: #eee9df; color: #77715f; cursor: pointer;
      overflow: hidden; display: grid; place-items: center;
      transform: rotate(var(--tilt, 0deg)); transition: transform .2s;
    }
    .book-img-wrap img, .book-img-wrap svg { width: 100%; height: 100%; object-fit: cover; grid-area: 1 / 1; }
    .book-img-wrap svg { padding: 19px; }
    .book-img-wrap:hover { transform: rotate(0deg) scale(1.07); }
    .book-img-wrap:focus-visible { outline: 2px solid #111; outline-offset: -5px; }
    .shape-circle { border-radius: 50%; }
    .shape-pebble { border-radius: 40% 60% 65% 35% / 55% 35% 65% 45%; }
    .shape-arch { border-radius: 50% 50% 8% 8%; }
    .shape-leaf { border-radius: 4% 65% 4% 65%; }
    .shape-oval { border-radius: 50%; width: 84px; height: 62px; margin: 5px 0; }
    .shape-flower { clip-path: polygon(50% 0%, 61% 12%, 79% 5%, 83% 23%, 100% 29%, 91% 47%, 100% 64%, 82% 72%, 79% 92%, 60% 88%, 50% 100%, 38% 88%, 19% 94%, 17% 74%, 0% 65%, 9% 48%, 0% 31%, 18% 23%, 21% 5%, 39% 12%); }
    .photo-credit { font-size: 7px; color: #999; text-decoration: none; }
    .photo-credit:hover { color: #111; }
    @media (prefers-reduced-motion: reduce) { .book-img-wrap { transition: none; } }

    .empty-state {
      padding: 80px 24px;
      text-align: center;
      font-size: 8pt;
      color: #999;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <header>
    <a href="books.html" class="turtle-home" title="books로" id="homeIcon"></a>
  </header>

  <div id="notesList" class="notes-list"></div>
  <div class="empty-state" id="emptyState" style="display:none">완독한 책이 없어요.</div>


  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAEqBSiNTrNLFbwYU8ASN8m88S1Ho-RlwU",
      authDomain: "booklog-2b5d0.firebaseapp.com",
      projectId: "booklog-2b5d0",
      storageBucket: "booklog-2b5d0.firebasestorage.app",
      messagingSenderId: "188307139074",
      appId: "1:188307139074:web:9c52728d1232db35f9551b",
      databaseURL: "https://booklog-2b5d0-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(FIREBASE_CONFIG);
    const booksRef = firebase.database().ref('bookshelf_v1');

    let allBooks = [];
    let _skipNextRender = false;

    function saveBooks() {
      localStorage.setItem('bookshelf_v1', JSON.stringify(allBooks));
      _skipNextRender = true;
      booksRef.set(JSON.stringify(allBooks));
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return `(${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')})`;
    }

    // 공개 독서 사진 중 책마다 일정한 조합을 선택한다. 클릭한 선택은 기기에 저장한다.
    const READING_PHOTOS = [
      { image: 'photo-1593724382028-100d4e0d180d', page: '0aajGG8nqTU', author: 'Giancarlo Duarte' },
      { image: 'photo-1567168539593-59673ababaae', page: 'Kyoshy7BJIQ', author: 'Dollar Gill' },
      { image: 'photo-1683178861337-ca70ef8c0db3', page: 'xYyJAC0IdyI', author: 'Zetong Li' },
      { image: 'photo-1763368230845-150be8503232', page: 'J7lC6BzGuZs', author: 'Emmanuel Black' },
    ];
    const ART_SHAPES = ['circle', 'pebble', 'arch', 'leaf', 'oval', 'flower'];
    function artSeed(value) {
      let hash = 2166136261;
      for (const char of String(value)) hash = Math.imul(hash ^ char.charCodeAt(0), 16777619);
      return hash >>> 0;
    }
    function createBookArt(book) {
      const key = 'book-art-v1:' + (book.id || book.title);
      const seed = artSeed(book.id || book.title);
      let variant = 0;
      try { variant = Number(localStorage.getItem(key)) || 0; } catch {}
      if (!Number.isSafeInteger(variant) || variant < 0) variant = 0;
      const art = document.createElement('div');
      art.className = 'book-art';
      const button = document.createElement('button');
      button.type = 'button';
      button.title = '누르면 다른 독서 스티커로 바뀌어요';
      button.setAttribute('aria-label', `${book.title || '책'} 독서 스티커 바꾸기`);
      const credit = document.createElement('a');
      credit.className = 'photo-credit';
      credit.target = '_blank';
      credit.rel = 'noopener noreferrer';
      function paint() {
        const photo = READING_PHOTOS[(seed + variant) % READING_PHOTOS.length];
        button.className = 'book-img-wrap shape-' + ART_SHAPES[((seed >>> 8) + variant) % ART_SHAPES.length];
        button.style.setProperty('--tilt', (((seed >>> 16) + variant * 3) % 13 - 6) + 'deg');
        // 네트워크가 끊겨도 빈칸 대신 작은 책 심볼을 표시한다.
        button.innerHTML = '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M16 8C12 5 6 5 3 6v20c4-1 9-1 13 2 4-3 9-3 13-2V6c-3-1-9-1-13 2Zm0 0v20"/></svg>';
        const img = document.createElement('img');
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.addEventListener('error', () => img.remove(), { once: true });
        img.src = `https://images.unsplash.com/${photo.image}?auto=format&fit=crop&w=180&h=180&q=80`;
        button.appendChild(img);
        credit.href = 'https://unsplash.com/photos/' + photo.page;
        credit.textContent = 'Unsplash';
        credit.title = `사진: ${photo.author} / Unsplash`;
        credit.setAttribute('aria-label', `${photo.author}의 원본 사진 보기`);
      }
      button.addEventListener('click', () => {
        variant += 1;
        try { localStorage.setItem(key, String(variant)); } catch {}
        paint();
      });
      paint();
      art.append(button, credit);
      return art;
    }

    // 메모 편집
    function startMemoEdit(book, memoWrap) {
      const current = book.note || '';
      memoWrap.innerHTML = '';
      const ta = document.createElement('textarea');
      ta.className = 'book-memo-edit';
      ta.value = current;
      ta.rows = Math.max(3, current.split('\n').length + 1);
      memoWrap.appendChild(ta);
      ta.focus();

      let done = false;
      function commit() {
        if (done) return;
        done = true;
        const val = ta.value.trim();
        book.note = val;
        saveBooks();
        renderMemo(book, memoWrap);
      }
      ta.addEventListener('blur', commit);
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ta.blur(); }
        if (e.key === 'Escape') { done = true; book.note = current; renderMemo(book, memoWrap); }
      });
    }

    function renderMemo(book, memoWrap) {
      memoWrap.innerHTML = '';
      if (book.note && book.note.trim()) {
        const el = document.createElement('div');
        el.className = 'book-memo';
        el.textContent = book.note.trim();
        el.addEventListener('click', () => startMemoEdit(book, memoWrap));
        memoWrap.appendChild(el);
      } else {
        const el = document.createElement('div');
        el.className = 'book-no-memo';
        el.textContent = '메모';
        el.addEventListener('click', () => startMemoEdit(book, memoWrap));
        memoWrap.appendChild(el);
      }
    }

    function renderNotes(books) {
      const doneBooks = books.filter(b => b.status === 'done');
      const list = document.getElementById('notesList');
      list.innerHTML = '';

      if (!doneBooks.length) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      document.getElementById('emptyState').style.display = 'none';

      doneBooks.forEach(book => {
        const entry = document.createElement('div');
        entry.className = 'book-entry';
        entry.dataset.id = book.id;

        // 콘텐츠 (텍스트 먼저)
        const content = document.createElement('div');
        content.className = 'book-content';

        const titleEl = document.createElement('div');
        titleEl.className = 'book-title';
        titleEl.textContent = book.title || '—';
        content.appendChild(titleEl);

        if (book.completedAt) {
          const dateEl = document.createElement('div');
          dateEl.className = 'book-date';
          dateEl.textContent = fmtDate(book.completedAt);
          content.appendChild(dateEl);
        }

        const memoWrap = document.createElement('div');
        memoWrap.className = 'book-memo-wrap';
        renderMemo(book, memoWrap);
        content.appendChild(memoWrap);

        entry.appendChild(createBookArt(book));

        entry.appendChild(content);

        list.appendChild(entry);
      });
    }

    // 거북이 픽셀 아이콘
    const TURTLE_PIXELS = [
      ['_','_','_','_','_','_','_','_','_','_','_','_','_','_','_','_'],
      ['_','_','_','_','_','_','_','_','_','_','_','K','K','K','_','_'],
      ['_','_','_','_','_','K','K','K','_','_','K','_','_','_','K','_'],
      ['_','_','_','_','K','_','K','_','K','_','K','_','K','_','K','_'],
      ['_','_','_','K','_','K','_','_','_','K','_','_','_','_','K','_'],
      ['_','_','K','_','K','_','K','_','K','_','K','_','_','K','K','_'],
      ['_','_','K','K','_','_','_','K','_','K','_','K','K','K','_','_'],
      ['_','_','K','_','K','_','K','_','_','_','K','K','_','_','_','_'],
      ['_','_','K','K','_','K','_','K','_','K','_','K','K','_','_','_'],
      ['_','_','K','_','K','_','K','K','K','_','K','_','K','_','_','_'],
      ['_','K','_','_','_','_','K','_','K','_','_','_','_','K','_','_'],
      ['_','_','K','K','K','K','_','_','_','K','K','K','K','_','_','_'],
      ['_','_','_','_','_','_','_','_','_','_','_','_','_','_','_','_'],
      ['_','_','_','_','_','_','_','_','_','_','_','_','_','_','_','_'],
    ];
    (function() {
      const el = document.getElementById('homeIcon');
      const grid = document.createElement('div');
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = 'repeat(16, 5px)';
      grid.style.gridTemplateRows = 'repeat(14, 5px)';
      grid.style.zoom = '0.2';
      grid.style.imageRendering = 'pixelated';
      TURTLE_PIXELS.forEach(row => row.forEach(c => {
        const px = document.createElement('div');
        px.style.width = '5px';
        px.style.height = '5px';
        if (c === 'K') px.style.background = '#111';
        grid.appendChild(px);
      }));
      el.appendChild(grid);
    })();

    // ── 커스텀 커서 ──
    const cursorEl = document.createElement('div');
    cursorEl.id = 'cursor';
    cursorEl.textContent = '⊹';
    document.body.appendChild(cursorEl);
    const trail = ['⋆', '˚', '₊', '⊹', '˚', '⋆'];
    let trailIndex = 0;
    document.addEventListener('mousemove', function(e) {
      cursorEl.style.left = e.clientX + 'px';
      cursorEl.style.top  = e.clientY + 'px';
      const dot = document.createElement('div');
      dot.className = 'cursor-trail';
      dot.textContent = trail[trailIndex++ % trail.length];
      dot.style.left = e.clientX + 'px';
      dot.style.top  = e.clientY + 'px';
      document.body.appendChild(dot);
      setTimeout(() => dot.remove(), 600);
    });
    document.addEventListener('mouseover', function(e) {
      const isClickable = !!e.target.closest('a, button, .book-img-wrap, .book-memo, .book-no-memo');
      cursorEl.textContent = isClickable ? '✶' : '⊹';
    });

    booksRef.on('value', snapshot => {
      if (_skipNextRender) { _skipNextRender = false; return; }
      const raw = snapshot.val();
      if (raw) {
        try { allBooks = JSON.parse(raw); } catch { allBooks = []; }
      } else {
        allBooks = [];
      }
      renderNotes(allBooks);
    });
  </script>
</body>
</html>
