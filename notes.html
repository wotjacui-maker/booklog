<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>seojae — 메모</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #111;
      font-family: 'Noto Sans KR', monospace;
      min-height: 100vh;
      cursor: none;
    }

    #cursor {
      position: fixed;
      pointer-events: none;
      color: #111;
      font-size: 14px;
      transform: translate(-50%, -50%);
      z-index: 9999;
    }

    .cursor-trail {
      position: fixed;
      pointer-events: none;
      color: #111;
      font-size: 11px;
      transform: translate(-50%, -50%);
      z-index: 9998;
      animation: trail-fade 0.6s ease forwards;
    }

    @keyframes trail-fade {
      0%   { opacity: 0.5; }
      100% { opacity: 0; }
    }

    header {
      display: flex;
      align-items: center;
      padding: 18px 24px 14px;
    }

    .turtle-home {
      display: inline-block;
      text-decoration: none;
      opacity: 0.5;
      transition: opacity 0.15s, transform 0.15s;
    }
    .turtle-home:hover { opacity: 1; transform: translateY(-1px); }

    .notes-list {
      position: relative;
      width: 100%;
      min-height: calc(100svh - 64px);
    }

    .book-entry {
      position: absolute;
      width: 140px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .book-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 100%;
    }

    .book-title {
      font-size: 8pt;
      font-weight: 400;
      color: #111;
      line-height: 1.5;
      word-break: keep-all;
    }

    .book-author {
      font-size: 6.5pt;
      color: #111;
    }

    .book-date {
      font-size: 6pt;
      color: #111;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .book-memo-wrap { margin-top: 8px; width: 100%; }

    .book-memo {
      font-size: 6.5pt;
      color: #111;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: keep-all;
      cursor: none;
      text-align: center;
    }

    .book-no-memo {
      font-size: 6pt;
      color: #111;
      cursor: none;
      letter-spacing: 1px;
    }

    .book-memo-edit {
      font-family: 'Noto Sans KR', monospace;
      font-size: 6.5pt;
      color: #111;
      line-height: 1.8;
      width: 100%;
      border: none;
      border-bottom: 1px solid #111;
      outline: none;
      background: transparent;
      resize: none;
      padding: 0;
      text-align: center;
    }

    .empty-state {
      padding: 80px 24px;
      text-align: center;
      font-size: 8pt;
      color: #999;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <header>
    <a href="books.html" class="turtle-home" title="books로" id="homeIcon"></a>
  </header>

  <div id="notesList" class="notes-list"></div>
  <div class="empty-state" id="emptyState" style="display:none">완독한 책이 없어요.</div>


  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAEqBSiNTrNLFbwYU8ASN8m88S1Ho-RlwU",
      authDomain: "booklog-2b5d0.firebaseapp.com",
      projectId: "booklog-2b5d0",
      storageBucket: "booklog-2b5d0.firebasestorage.app",
      messagingSenderId: "188307139074",
      appId: "1:188307139074:web:9c52728d1232db35f9551b",
      databaseURL: "https://booklog-2b5d0-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(FIREBASE_CONFIG);
    const booksRef = firebase.database().ref('bookshelf_v1');

    let allBooks = [];
    let _skipNextRender = false;

    function saveBooks() {
      localStorage.setItem('bookshelf_v1', JSON.stringify(allBooks));
      _skipNextRender = true;
      booksRef.set(JSON.stringify(allBooks));
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return `(${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')})`;
    }

    // 페이지를 열 때만 새 난수를 만든다. 편집·동기화 중에는 같은 배치를 유지한다.
    const notePositions = new Map();
    function positionFor(id) {
      if (!notePositions.has(id)) {
        notePositions.set(id, { order: Math.random(), x: Math.random(), y: Math.random() });
      }
      return notePositions.get(id);
    }
    let layoutFrame;
    function scheduleLayout() {
      cancelAnimationFrame(layoutFrame);
      layoutFrame = requestAnimationFrame(layoutNotes);
    }
    function layoutNotes() {
      const list = document.getElementById('notesList');
      const entries = [...list.children];
      if (!entries.length) { list.style.height = '0px'; return; }
      const margin = 24, gap = 36;
      const available = Math.max(1, list.clientWidth - margin * 2);
      const width = Math.min(140, available);
      const columns = Math.max(1, Math.floor((available + gap) / (width + gap)));
      const lane = available / columns;
      const bottoms = Array(columns).fill(0);
      entries.sort((a, b) => positionFor(a.dataset.id).order - positionFor(b.dataset.id).order);
      entries.forEach((entry, index) => {
        const point = positionFor(entry.dataset.id);
        const column = index % columns;
        entry.style.width = width + 'px';
        const x = margin + column * lane + point.x * Math.max(0, lane - width);
        const y = bottoms[column] + 32 + point.y * 100;
        entry.style.left = x + 'px';
        entry.style.top = y + 'px';
        bottoms[column] = y + entry.offsetHeight + 40;
      });
      list.style.height = Math.max(...bottoms) + 40 + 'px';
    }
    // 메모 길이·글꼴·화면 폭이 바뀌어도 텍스트가 겹치지 않게 다시 배치한다.
    const noteResizeObserver = new ResizeObserver(scheduleLayout);
    window.addEventListener('resize', scheduleLayout);
    document.fonts.ready.then(scheduleLayout);

    // 메모 편집
    function startMemoEdit(book, memoWrap) {
      const current = book.note || '';
      memoWrap.innerHTML = '';
      const ta = document.createElement('textarea');
      ta.className = 'book-memo-edit';
      ta.value = current;
      ta.rows = Math.max(3, current.split('\n').length + 1);
      memoWrap.appendChild(ta);
      ta.focus();

      let done = false;
      function commit() {
        if (done) return;
        done = true;
        const val = ta.value.trim();
        book.note = val;
        saveBooks();
        renderMemo(book, memoWrap);
      }
      ta.addEventListener('blur', commit);
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ta.blur(); }
        if (e.key === 'Escape') { done = true; book.note = current; renderMemo(book, memoWrap); }
      });
    }

    function renderMemo(book, memoWrap) {
      memoWrap.innerHTML = '';
      if (book.note && book.note.trim()) {
        const el = document.createElement('div');
        el.className = 'book-memo';
        el.textContent = book.note.trim();
        el.addEventListener('click', () => startMemoEdit(book, memoWrap));
        memoWrap.appendChild(el);
      } else {
        const el = document.createElement('div');
        el.className = 'book-no-memo';
        el.textContent = '메모';
        el.addEventListener('click', () => startMemoEdit(book, memoWrap));
        memoWrap.appendChild(el);
      }
    }

    function renderNotes(books) {
      const doneBooks = books.filter(b => b.status === 'done');
      const list = document.getElementById('notesList');
      noteResizeObserver.disconnect();
      list.innerHTML = '';
      list.style.display = doneBooks.length ? 'block' : 'none';

      if (!doneBooks.length) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      document.getElementById('emptyState').style.display = 'none';

      doneBooks.forEach(book => {
        const entry = document.createElement('div');
        entry.className = 'book-entry';
        entry.dataset.id = book.id;

        // 콘텐츠 (텍스트 먼저)
        const content = document.createElement('div');
        content.className = 'book-content';

        const titleEl = document.createElement('div');
        titleEl.className = 'book-title';
        titleEl.textContent = book.title || '—';
        content.appendChild(titleEl);

        if (book.completedAt) {
          const dateEl = document.createElement('div');
          dateEl.className = 'book-date';
          dateEl.textContent = fmtDate(book.completedAt);
          content.appendChild(dateEl);
        }

        const memoWrap = document.createElement('div');
        memoWrap.className = 'book-memo-wrap';
        renderMemo(book, memoWrap);
        content.appendChild(memoWrap);

        entry.appendChild(content);

        list.appendChild(entry);
        noteResizeObserver.observe(entry);
      });
      scheduleLayout();
    }

    // 거북이 픽셀 아이콘
    const TURTLE_PIXELS = [
      ['_','_','_','_','_','_','_','_','_','_','_','_','_','_','_','_'],
      ['_','_','_','_','_','_','_','_','_','_','_','K','K','K','_','_'],
      ['_','_','_','_','_','K','K','K','_','_','K','_','_','_','K','_'],
      ['_','_','_','_','K','_','K','_','K','_','K','_','K','_','K','_'],
      ['_','_','_','K','_','K','_','_','_','K','_','_','_','_','K','_'],
      ['_','_','K','_','K','_','K','_','K','_','K','_','_','K','K','_'],
      ['_','_','K','K','_','_','_','K','_','K','_','K','K','K','_','_'],
      ['_','_','K','_','K','_','K','_','_','_','K','K','_','_','_','_'],
      ['_','_','K','K','_','K','_','K','_','K','_','K','K','_','_','_'],
      ['_','_','K','_','K','_','K','K','K','_','K','_','K','_','_','_'],
      ['_','K','_','_','_','_','K','_','K','_','_','_','_','K','_','_'],
      ['_','_','K','K','K','K','_','_','_','K','K','K','K','_','_','_'],
      ['_','_','_','_','_','_','_','_','_','_','_','_','_','_','_','_'],
      ['_','_','_','_','_','_','_','_','_','_','_','_','_','_','_','_'],
    ];
    (function() {
      const el = document.getElementById('homeIcon');
      const grid = document.createElement('div');
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = 'repeat(16, 5px)';
      grid.style.gridTemplateRows = 'repeat(14, 5px)';
      grid.style.zoom = '0.2';
      grid.style.imageRendering = 'pixelated';
      TURTLE_PIXELS.forEach(row => row.forEach(c => {
        const px = document.createElement('div');
        px.style.width = '5px';
        px.style.height = '5px';
        if (c === 'K') px.style.background = '#111';
        grid.appendChild(px);
      }));
      el.appendChild(grid);
    })();

    // ── 커스텀 커서 ──
    const cursorEl = document.createElement('div');
    cursorEl.id = 'cursor';
    cursorEl.textContent = '⊹';
    document.body.appendChild(cursorEl);
    const trail = ['⋆', '˚', '₊', '⊹', '˚', '⋆'];
    let trailIndex = 0;
    document.addEventListener('mousemove', function(e) {
      cursorEl.style.left = e.clientX + 'px';
      cursorEl.style.top  = e.clientY + 'px';
      const dot = document.createElement('div');
      dot.className = 'cursor-trail';
      dot.textContent = trail[trailIndex++ % trail.length];
      dot.style.left = e.clientX + 'px';
      dot.style.top  = e.clientY + 'px';
      document.body.appendChild(dot);
      setTimeout(() => dot.remove(), 600);
    });
    document.addEventListener('mouseover', function(e) {
      const isClickable = !!e.target.closest('a, button, .book-memo, .book-no-memo');
      cursorEl.textContent = isClickable ? '✶' : '⊹';
    });

    booksRef.on('value', snapshot => {
      if (_skipNextRender) { _skipNextRender = false; return; }
      const raw = snapshot.val();
      if (raw) {
        try { allBooks = JSON.parse(raw); } catch { allBooks = []; }
      } else {
        allBooks = [];
      }
      renderNotes(allBooks);
    });
  </script>
</body>
</html>
